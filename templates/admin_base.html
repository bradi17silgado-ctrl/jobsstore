<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>{% block title %}Administración{% endblock %} | JOBS Store</title>
    <link rel="icon" type="image/png" href="{{ url_for('static', filename='img/favicon.png') }}">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="adm">
<header class="adm-top">
    <div class="wrap adm-top-in">
        <a href="{{ url_for('admin_panel') }}" class="brand" aria-label="Panel JOBS Store">
            <img src="{{ url_for('static', filename='img/logo-emblema.png') }}" alt="" width="40" height="36">
            <span class="brand-txt"><b>JOBS</b><i>Store</i></span>
            <span class="adm-tag">Admin</span>
        </a>
        {% if session.get('admin') %}
        <nav class="adm-nav" aria-label="Administración">
            <a href="{{ url_for('admin_panel') }}" {% if request.endpoint == 'admin_panel' %}aria-current="page"{% endif %}>Productos</a>
            <a href="{{ url_for('compras') }}">Compras</a>
            <a href="{{ url_for('inicio') }}" target="_blank" rel="noopener">Ver tienda ↗</a>
            <form method="post" action="{{ url_for('admin_salir') }}">
                <input type="hidden" name="csrf" value="{{ csrf_token() }}">
                <button type="submit" class="link-btn">Salir</button>
            </form>
        </nav>
        {% endif %}
    </div>
</header>
<main class="wrap adm-main">
    {% with mensajes = get_flashed_messages(with_categories=true) %}
    {% if mensajes %}
    <div class="adm-flash" role="status">
        {% for cat, m in mensajes %}<p class="adm-msg adm-{{ cat }}">{{ m }}</p>{% endfor %}
    </div>
    {% endif %}
    {% endwith %}
    {% block content %}{% endblock %}
</main>
</body>
</html>
